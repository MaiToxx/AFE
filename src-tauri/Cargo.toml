[package]
name = "afe"
version = "0.4.1"
description = "Tableau de bord pour auto-entrepreneurs : devis, factures, cotisations, chiffre d'affaires."
authors = ["AFE"]
edition = "2021"

[lib]
name = "afe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Registre Windows : début de la période d'essai consigné hors du dossier de l'application (src/essai.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
