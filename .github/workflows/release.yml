# Publie une Release GitHub (installateur Windows signé + latest.json pour les mises à jour
# automatiques) à chaque tag `vX.Y.Z`. Secrets requis dans le dépôt :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de scripts/updater/afe-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe de la clé (vide si aucun)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions figées sur un commit précis, et non sur une étiquette que son auteur peut déplacer :
      # ce flux détient la clé qui signe les mises à jour installées chez les clients.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AFE ${{ github.ref_name }}'
          releaseBody: 'Installateur Windows (x64). Les versions installées se mettent à jour automatiquement.'
          releaseDraft: false
          prerelease: false
