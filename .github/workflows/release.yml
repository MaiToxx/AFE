# Publie une Release GitHub (installateur Windows signé + latest.json pour les mises à jour
# automatiques) à chaque tag `vX.Y.Z`. Secrets requis dans le dépôt :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de scripts/updater/afe-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe de la clé (vide si aucun)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AFE ${{ github.ref_name }}'
          releaseBody: 'Installateur Windows (x64). Les versions installées se mettent à jour automatiquement.'
          releaseDraft: false
          prerelease: false
